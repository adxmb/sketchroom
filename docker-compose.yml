# Postgres for local development. Start it with: docker compose up -d db
services:
    db:
        image: postgres:16
        environment:
            POSTGRES_USER: sketch
            POSTGRES_PASSWORD: sketch
            POSTGRES_DB: sketchroom
        ports:
            - "5433:5432"
        volumes:
            - dbdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U sketch -d sketchroom"]
            interval: 3s
            timeout: 3s
            retries: 20

    # The production image, for a test on your own computer:
    #   docker compose --profile prod up --build
    # Then open http://localhost:3000
    app:
        profiles: ["prod"]
        build: .
        depends_on:
            db:
                condition: service_healthy
        environment:
            DATABASE_URL: postgres://sketch:sketch@db:5432/sketchroom
            # The page is on http://localhost. Secure cookies need https, so turn them off for this test
            SECURE_COOKIES: "false"
        ports:
            - "3000:3000"
volumes:
    dbdata:
